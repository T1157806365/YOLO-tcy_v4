# ============================================================
# RLSFA coarse UAV anchor + Local-GTGA centered scale
# + alignment-guided BHLR-v2
# + YOLO26m P2/P3/P4/P5 Detect
#
# IMPORTANT:
#   P2 is detection-only in this experiment.
#   Alignment : P3/P4/P5
#   BHLR      : P3
#   Fusion    : P3/P4/P5
#   Detect    : P2/P3/P4/P5
# ============================================================
traincc:
  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3
  mkdir -p logs pid
  nohup python -u train_rlsfa_gtga_bhlr_v2.py \
    --cfg /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/configs/experiments/rlsfa_gtga_bhlr_v2/uavcb_rlsfa_gtga_centered_bhlr_v2_yolo26m-p2_1920_640.yaml \
    > logs/uavcb_UAVCB_RLSFA-Coarse_GTGA-Scale_CenteredPivot_BHLRv2-P3_0_26m_P2.log 2>&1 &
  echo $! \
    > pid/uavcb_UAVCB_RLSFA-Coarse_GTGA-Scale_CenteredPivot_BHLRv2-P3_0_26m_P2.pid
  tail -f logs/uavcb_UAVCB_RLSFA-Coarse_GTGA-Scale_CenteredPivot_BHLRv2-P3_0_26m_P2.log

  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3
  python val_rlsfa_gtga_bhlr_v2.py \
    --weights /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/runs/rlsfa_gtga_centered_bhlr_v2/yolo26m_UAVCB_RLSFA-Coarse_GTGA-Scale_CenteredPivot_BHLRv2-P3_rgb1920_sem640_tir640_seed0_P2/weights/best.pt \
    --split test \
    --device 5 \
    --batch 16 \
    --workers 4 \
    --conf 0.001 \
    --iou 0.70 \
    --plots


model:
  variant: rlsfa_gtga_centered_bhlr_v2
  name: yolo26m-p2
  nc: 1
  pretrained: true

  fusion: add

  # CRITICAL FOR P2:
  # yolo26m-p2 backbone outputs include:
  #   layer 2  = P2
  #   layer 4  = P3
  #   layer 6  = P4
  #   layer 10 = P5
  #
  # Keep RGB-T fusion/alignment/BHLR on the original P3/P4/P5 only.
  fusion_indices: [4, 6, 10]

  align_mode: bilinear

  rlsfa_gtga_centered:
    enabled: true
    type: rlsfa_gtga_centered

    reference_scale: 3
    apply_scales: [3, 4, 5]
    hidden_channels: 32

    coarse_radius: 20
    coarse_temperature: 0.10
    use_targetness_for_correlation: true

    anchor_power: 4.0

    moment_power: 2.0
    local_window_sigma: 0.10
    moment_border_margin: 2
    sigma_min: 0.005

    scale_min: 0.50
    scale_max: 2.00

    padding_mode: border
    align_corners: true

  bhlr:
    enabled: true
    scales: [3]

    high_to_semantic_ratio: 3
    detail_channels: 48
    stem_channels: 16
    guide_channels: 24

    guidance_mode: alignment
    detach_alignment_guidance: true


data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/configs/datasets/UAV-CB-RGB.yaml
  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/configs/datasets/UAV-CB-TIR.yaml

  rgb_imgsz: 1920
  rgb_semantic_imgsz: 640
  tir_imgsz: 640
  pair_mode: relative


train:
  # Keep/replace this device list with the GPUs actually available to you.
  # The remaining training parameters are unchanged.
  device: "3,4"

  batch: 8
  batch_mode: global
  workers: 4

  epochs: 300

  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0

  # Keep false first. Do not hide real unused-parameter problems.
  ddp_find_unused_parameters: false

  patience: 50
  early_stop_min_delta: 0.000001
  resume: null

  stage2:
    enabled: true
    epochs: 200
    lr0: 0.001
    lrf: 0.01
    patience: 50
    early_stop_min_delta: 0.000001


augment:
  fliplr: 0.5
  flipud: 0.0


loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5

  alignment:
    enabled: true

    lambda_alignment: 0.20
    lambda_anchor: 1.00
    lambda_coarse: 1.00
    lambda_scale: 1.00
    lambda_targetness: 0.20

    smooth_l1_beta: 1.0
    targetness_alpha: 0.75
    targetness_gamma: 2.0

    gtga_gaussian_sigma_factor: 0.25
    gtga_gaussian_sigma_min_px: 1.0

    clamp_gt_translation: true


output:
  project: runs/rlsfa_gtga_centered_bhlr_v2
  name: yolo26m_UAVCB_RLSFA-Coarse_GTGA-Scale_CenteredPivot_BHLRv2-P3_rgb1920_sem640_tir640_seed0_P2
