  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3
  python visualize_ducf_safe_v2_internal_ADAPTIVE_RADIUS_WINDOW.py \
    --weights /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/runs/rlsfa_gtga_bhlr_ducf_safe_v2_adaptive_rw/yolo26m_UAVCB_TIR2RGB_BHLRv2_AdaptiveRadiusWindow_rgb1920_sem640_tir640_seed0/weights/best.pt \
    --split test \
    --device 5 \
    --indices 0 50 100 150 200 250 300 350 400 450 500 550 600 \
    --scale 3 \
    --conf 0.25 \
    --iou 0.70 \
    --canvas 1200
model:
  variant: rlsfa_gtga_centered_bhlr_v2
  name: yolo26m
  nc: 1
  pretrained: true
  fusion: add
  align_mode: bilinear

  # ----------------------------------------------------------
  # RLSFA + Local-GTGA centered alignment
  # Adaptive coarse search radius + adaptive local window
  # ----------------------------------------------------------
  rlsfa_gtga_centered:
    enabled: true
    type: rlsfa_gtga_centered
    reference_scale: 3
    apply_scales: [3, 4, 5]
    hidden_channels: 32

    # -------------------------
    # Adaptive coarse translation search
    # -------------------------
    # Historical fixed value retained as fallback.
    coarse_radius: 20
    adaptive_coarse_radius: true
    adaptive_coarse_radius_min: 8
    adaptive_coarse_radius_max: 24
    adaptive_coarse_radius_contrast_ref: 0.10
    adaptive_coarse_radius_extent_ref: 0.08

    coarse_temperature: 0.10
    use_targetness_for_correlation: true
    anchor_power: 4.0

    # -------------------------
    # Adaptive Local-GTGA window
    # -------------------------
    moment_power: 2.0

    # Historical fixed value retained as fallback.
    local_window_sigma: 0.10
    adaptive_local_window: true
    adaptive_window_sigma_min: 0.04
    adaptive_window_sigma_max: 0.12
    adaptive_window_extent_scale: 2.50
    adaptive_window_contrast_ref: 0.10

    moment_border_margin: 2
    sigma_min: 0.005
    scale_min: 0.50
    scale_max: 3.00
    padding_mode: border
    align_corners: true

    # Keep OFF for clean comparison with the previous effective setup.
    reliability_gate:
      enabled: false

  # ----------------------------------------------------------
  # BHLR-v2: unchanged
  # ----------------------------------------------------------
  bhlr:
    enabled: true
    scales: [3]
    high_to_semantic_ratio: 3
    detail_channels: 48
    stem_channels: 16
    guide_channels: 24
    guidance_mode: alignment
    detach_alignment_guidance: true

  # ----------------------------------------------------------
  # DUCF-Safe v2: unchanged
  # ----------------------------------------------------------
  ducf:
    enabled: false
    scales: [3]
    hidden_channels: 64
    use_target_support: true
    max_consensus_ratio: 0.10
    max_innovation_ratio: 0.15

# ============================================================
# Dataset
# ============================================================
data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/configs/datasets/UAV-CB-RGB.yaml
  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/configs/datasets/UAV-CB-TIR.yaml
  rgb_imgsz: 1920
  rgb_semantic_imgsz: 640
  tir_imgsz: 640
  pair_mode: relative

# ============================================================
# Training: unchanged
# ============================================================
train:
  device: "2,3,4,5"
  batch: 16
  batch_mode: global
  workers: 4
  epochs: 300
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0
  patience: 50
  early_stop_min_delta: 0.000001
  resume: null

  stage2:
    enabled: true
    epochs: 200
    lr0: 0.001
    lrf: 0.01
    patience: 50
    early_stop_min_delta: 0.000001

augment:
  fliplr: 0.5
  flipud: 0.0

loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5

  alignment:
    enabled: true
    lambda_alignment: 0.20
    lambda_anchor: 1.00
    lambda_coarse: 1.00
    lambda_scale: 1.00
    lambda_targetness: 0.20
    smooth_l1_beta: 1.0
    targetness_alpha: 0.75
    targetness_gamma: 2.0
    gtga_gaussian_sigma_factor: 0.25
    gtga_gaussian_sigma_min_px: 1.0
    clamp_gt_translation: true

output:
  project: runs/rlsfa_gtga_bhlr_ducf_safe_v2_adaptive_rw
  name: yolo26m_UAVCB_TIR2RGB_BHLRv2_AdaptiveRadiusWindow_rgb1920_sem640_tir640_seed0
