  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3
  mkdir -p logs pid
  nohup python -u train_rlsfa_gtga_bhlr_v2.py \
    --cfg /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v3/configs/experiments/rlsfa_gtga_bhlr_ducf_safe_v2/uavcb_rlsfa_gtga_bhlr_ducf_safe_v2_adaptive_rw_yolo26m_1920_640.yaml \
    > logs/uavcb_UAVCB_RLSFA-AdaptiveRadius_GTGA-AdaptiveWindow_BHLRv2-P3_26m.log 2>&1 &
  echo $! \
    > pid/uavcb_UAVCB_RLSFA-AdaptiveRadius_GTGA-AdaptiveWindow_BHLRv2-P3_26m.pid
  tail -f logs/uavcb_UAVCB_RLSFA-AdaptiveRadius_GTGA-AdaptiveWindow_BHLRv2-P3_26m.log

  conda activate tcy
